  # =========================================================================
  # NEEDS MANUAL DOWNLOAD
  #
  # These cannot be fetched by script. Put the file in data/corpus/manual/,
  # then switch the entry from a comment to enabled with a local: path.
  # =========================================================================

  # ICD-11 6A02 Autism Spectrum Disorder.
  # The ICD-11 browser at icd.who.int renders its content with JavaScript, so a
  # scripted fetch returns only the navigation shell. Two options:
  #   1. Download the print release, extract the 6A02 section, save as a text
  #      or PDF file in data/corpus/manual/:
  #      https://icdcdn.who.int/static/releasefiles/2025-01/print-ICD-11-MMS-en.zip
  #   2. Open https://icd.who.int/browse/2025-01/mms/en#437815624 in a browser
  #      and save the 6A02 entry manually.
  #
  # - id: icd11_6a02
  #   name: ICD-11 6A02 Autism Spectrum Disorder
  #   local: manual/icd11_6a02.pdf
  #   authority: 1
  #   enabled: true

  # DSM-5 ASD criteria.
  # DSM-5 is APA copyright and is not freely available, so it cannot be added
  # to the corpus. The CDC and NIMH pages above restate the criteria in
  # accessible form and are already included, which covers the same ground for
  # a caregiver-facing tool. Cite DSM-5 in the report, do not index it.

# ---------------------------------------------------------------------------
# NAVIGATION BOILERPLATE.
#
# Lines matching these patterns are dropped before chunking. Each pattern is
# matched against a whole line, case-insensitively, so prose that happens to
# mention one of these words is untouched.
#
# These lines survive HTML extraction because the pages put them outside the
# tags build_corpus strips. They matter more than their volume suggests: they
# sit in the first chunk of a page beside its title, which makes that chunk
# rank highly for any query phrased like a title, ahead of the chunk that
# answers the question (F-P2-011).
#
# Add a pattern here rather than in code. Regular expression syntax.
# ---------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # Added 26 August 2026 with benchmark v4. Every source below is cited by at
  # least one v4 reference answer, so a prompt whose source is missing here
  # cannot be answered from the corpus however good retrieval is.
  #
  # authority 5 is new: commercial and blog content. Several v4 answers are
  # sourced from ABA providers' and private clinics' marketing pages, which
  # are not clinical guidance and in some cases advocate approaches the
  # autistic community contests. They are included because the reference
  # answers cite them and excluding them would leave those prompts
  # ungroundable, and they are tiered so retrieval can be measured with and
  # without them. See D-125.
  # -------------------------------------------------------------------------
