# RAG corpus source manifest.
#
# THIS IS THE FILE TO EDIT WHEN ADDING A SOURCE. Nothing else needs changing.
# scripts/build_corpus.py reads this, fetches each url, extracts the readable
# text, and writes the chunked corpus that the retriever indexes.
#
# Fields per source:
#   id           short stable identifier, used in passage ids. No spaces.
#   name         human-readable name. Must match the source_name column in the
#                benchmark for retrieval evaluation to score against it.
#   url          page to fetch, or
#   local        file under data/corpus/manual/ for sources that block fetching
#   authority    tier used when two sources disagree.
#                1 = primary clinical guideline
#                2 = official public health body
#                3 = instrument documentation
#   enabled      set false to keep a source listed but out of the corpus
#
# ---------------------------------------------------------------------------
# LICENSING. Read before publishing or committing the built corpus.
#
# M-CHAT-R/F: free for non-profit teaching and research, which covers this
# project, but reposting is not permitted without a licence. NICE: download for
# private research and study only, not for redistribution. Consequently
# data/corpus/corpus.csv and data/corpus/raw/ are gitignored. Build the corpus
# locally, do not commit it, and do not publish the extracted text.
# ---------------------------------------------------------------------------

sources:

  # =========================================================================
  # SCREENING INSTRUMENT DOCUMENTATION
  #
  # Highest value group. Phase 1 hallucination on screening item clarification
  # was 43.8%, driven by wrong age ranges, wrong item counts and reversed
  # scoring thresholds. None of the general health pages below cover these.
  # =========================================================================

  - id: qchat_scoring_key
    name: Q-CHAT Scoring Key
    url: https://docs.autismresearchcentre.com/tests/QCHAT_scoringkey.pdf
    authority: 3
    enabled: false
    # DISABLED. Raw scoring grid, not prose. Its 10 passages are columns of
    # response options that match many queries lexically while carrying no
    # explanatory content. Dropping it and qchat_instrument raised probe
    # coverage from 4/7 to 6/7 at k=5. See scoring/evaluate_corpus_coverage.py.
    # Fixes: "a score of 6 out of 10 on the Q-CHAT is a typical score"

  - id: qchat_instrument
    name: Quantitative Checklist for Autism in Toddlers (Q-CHAT)
    url: https://docs.autismresearchcentre.com/tests/QCHAT.pdf
    authority: 3
    enabled: false
    # DISABLED. The raw questionnaire. 10 passages of literal item text
    # ("Does your child look at you when you call his/her name?") which
    # surfaced for unrelated queries such as "do I need a referral".
    # Index documentation about an instrument, not the instrument itself.
    # Fixes: item wording and response scale questions

  - id: qchat_arc_page
    name: Q-CHAT Autism Research Centre
    url: https://www.autismresearchcentre.com/tests/quantitative-checklist-for-autism-in-toddlers-q-chat/
    authority: 3
    enabled: true
    # Allison et al. 2008 establishes the 18 to 24 month range.
    # Fixes: "Q-CHAT-10 is designed for children aged 4 to 9 years"

  - id: qchat10_red_flags
    name: Allison et al. 2012 Short Q-CHAT Red Flags
    url: https://docs.autismresearchcentre.com/papers/2012_Allisonetal_JAACAP_RedFlags.pdf
    authority: 3
    enabled: false
    # DISABLED. Full academic paper: 122 passages, 29% of the whole corpus,
    # most of it methods, statistics and references. It crowded out short
    # authoritative pages. Cite it in the report rather than indexing it.
    # The paper that defines Q-CHAT-10 and its cutoff.

  - id: mchat_scoring
    name: Scoring M-CHAT-R/F
    url: https://www.mchatscreen.com/mchat-rf/scoring/
    authority: 3
    enabled: true
    # Carries the scoring bands directly: 0-2 low, 3-7 moderate, 8-20 high.
    # Fixes: "failing 5 items" interpretation and the reversed thresholds.

  - id: mchat_guidelines
    name: M-CHAT-R/F Guidelines for Use
    url: https://www.mchatscreen.com/mchat-rf/
    authority: 3
    enabled: true

  - id: instrument_reference
    name: Screening Instrument Quick Reference
    local: manual/instrument_reference.txt
    authority: 3
    enabled: true
    # Compiled from the cited instrument documentation. Exists because several
    # facts appear on the live pages only obliquely, for example the Q-CHAT age
    # range appearing inside a paper title rather than in body text, and so are
    # not reliably retrievable from the fetched HTML. Every statement is
    # traceable to a cited source. Fixes the M-CHAT 16 to 30 month range, the
    # Q-CHAT 18 to 24 month range, and the scoring bands.

  - id: mchat_faq
    name: M-CHAT Parent and Professional FAQ
    url: https://www.mchatscreen.com/contact-2/
    authority: 3
    enabled: true
    # Fixes: "M-CHAT can be used for a three and a half year old"
    # Actual range is 16 to 30 months.

